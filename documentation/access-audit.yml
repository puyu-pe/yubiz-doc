  evidence_id: EV-SRC-330857-CONTROL-RELATIONS
  controls:
  - id: CTRL-PRODUCT-HEADER-CREATE-EDIT
    container: encabezado de Lista de productos y fila del producto
    gesture: clic de revelación y doble clic de edición
    reveal: menú del encabezado antes de la opción de alta
    option: Nuevo producto
    next_state: formularios Agregar producto y Editar producto
    visible_tokens: [encabezado de **Lista de productos**, icono de tres puntos verticales, '**Nuevo producto**', menú desplegable, '**Agregar producto**', doble clic, '**Editar producto**']
  - id: CTRL-UNIT-HEADER-CREATE
    container: encabezado de Lista de unidades
    gesture: clic
    reveal: menú desplegable del encabezado
    option: Agregar unidad
    next_state: formulario Agregar unidad
    visible_tokens: [Lista de unidades, tres puntos verticales, '**Agregar unidad**', menú desplegable]
  - id: CTRL-SERVICE-HEADER-CREATE
    container: encabezado de Lista de servicios
    gesture: clic
    reveal: menú desplegable del encabezado
    option: Agregar servicio
    next_state: formulario Agregar servicio
    visible_tokens: [Lista de servicios, tres puntos verticales, '**Agregar servicio**', menú desplegable]
  - id: CTRL-PAYMENT-DETAIL
    container: menú de acciones del detalle
    gesture: doble clic de fila seguido de clic
    reveal: abrir el detalle y su menú de acciones
    option: Registrar pago
    next_state: Pagos / Agregar
    visible_tokens: [doble clic, menú de acciones del detalle, '**Registrar pago**', '**Pagos / Agregar**']
  - id: CTRL-PERIOD-HEADER-CREATE
    container: menú de acciones del encabezado de períodos
    gesture: clic
    reveal: abrir el menú del encabezado
    option: Nuevo periodo
    next_state: formulario de período
    visible_tokens: [tres puntos verticales, '**Nuevo periodo**', formulario]
  - id: CTRL-PRESALE-ROW-OPEN
    container: menú del encabezado y fila de preventa
    gesture: doble clic de fila
    reveal: Editar columnas no revela el detalle
    option: Editar columnas
    next_state: detalle de preventa
    visible_tokens: ['**Editar columnas**', no abre una preventa, doble clic, fila, detalle]
  - id: CTRL-SALE-DETAIL-EXCHANGE
    container: menú de acciones del detalle de venta
    gesture: doble clic de fila seguido de clic
    reveal: abrir el detalle y comprobar que Canjear está habilitado
    option: Canjear
    next_state: formulario de canje de nota de venta
    visible_tokens: [doble clic, menú de acciones del detalle, '**Canjear**', Canjear cupón de descuento]
