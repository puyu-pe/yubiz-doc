name: publish-manual

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed main SHA to build and upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-production-publication
  cancel-in-progress: false

jobs:
  publish:
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Recheck reviewed source and build a bound artifact
        env:
          PUBLISH_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_manual.py --root .
          python scripts/build_manual.py --root . --deployment-target documentation/deployment-target.yml --output .build/publish --source-date-epoch 1700000000 --source-commit "$PUBLISH_SHA"
      - name: Upload only after the guard approves the configured target
        env:
          PUBLISH_SHA: ${{ inputs.sha }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.PUBLISH_KNOWN_HOSTS }}
          PUBLISH_SSH_PRIVATE_KEY: ${{ secrets.PUBLISH_SSH_PRIVATE_KEY }}
        run: python scripts/publish_manual.py --root . --artifact-dir .build/publish --sha "$PUBLISH_SHA" --upload
