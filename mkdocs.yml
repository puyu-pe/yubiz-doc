site_name: Yubiz · Guías para tu negocio
site_description: Guías operativas de Yubiz.
site_url: http://127.0.0.1:8000/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: es
  custom_dir: overrides
  features:
    - navigation.path
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/sidebar-accordion.js
